[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-vuln-agent"
version = "0.1.0"
description = "IoT 固件漏洞挖掘 Agent — Claude Code 通过 MCP 工具链（VM SSH + IDA Pro）进行固件分析、二进制逆向、漏洞发现与动态验证（user-mode/chroot）"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.28",
    "paramiko>=5.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "structlog>=26.0",
]





[tool.setuptools.packages.find]
where = ["src"]
